name: Nightly
# Slow (real models) + scale tests with the [inference] extra, and the
# inference image built from the base and smoked on the hash/deterministic
# fallback. Run on demand: gh workflow run Nightly; check BY NAME:
#   gh run list --workflow Nightly --limit 1
on:
  schedule:
    - cron: "17 3 * * *"  # odd minute: top-of-hour schedules queue
  workflow_dispatch:

permissions:
  contents: read

# Explicit bash = `bash -eo pipefail`.
defaults:
  run:
    shell: bash

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  slow-scale:
    name: slow + scale (pytest, [inference])
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mcprouter
          POSTGRES_PASSWORD: mcprouter
          POSTGRES_DB: mcprouter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcprouter"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MCPR_DATABASE_URL: postgresql+psycopg://mcprouter:mcprouter@localhost:5432/mcprouter
      MCPR_REQUIRE_DB: "1"
      MCPR_RUN_SLOW: "1"
      HF_HOME: ${{ github.workspace }}/models-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install (locked dev + CPU torch + [inference])
        run: |
          uv sync --locked --extra dev --python 3.12
          uv pip install --python .venv/bin/python --index-url https://download.pytorch.org/whl/cpu torch
          uv pip install --python .venv/bin/python -e '.[inference]'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models-cache
          key: models-cache-${{ hashFiles('src/mcprouter/settings.py', 'src/mcprouter/inference/**') }}
          restore-keys: models-cache-
      - name: pytest (slow or scale)
        run: |
          mkdir -p reports
          pytest tests/ -q -n auto --dist loadgroup -m "slow or scale" \
            --junitxml=reports/nightly.xml 2>&1 | tee reports/nightly.log
      - name: Upload pytest output on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-nightly
          path: reports/
          retention-days: 7

  inference-image:
    name: inference image (build + smoke on hash fallback)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build base image (cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: mcp-router:local
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      # Plain `docker build`: the classic builder sees the locally loaded base
      # (a buildx container builder would try to pull mcp-router:local).
      - name: Build inference image
        run: docker build -f Dockerfile.inference --build-arg BASE_IMAGE=mcp-router:local -t mcp-router:local-inference .
      - name: Write .env (ephemeral per-run credentials)
        run: |
          admin=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          agent=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          pgpw=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')
          echo "::add-mask::$admin"; echo "::add-mask::$agent"; echo "::add-mask::$pgpw"
          cp .env.example .env
          # The inference image's ENV selects bge/laya; compose loads .env via
          # env_file, so the zero-ML fallback has to be requested explicitly.
          # This job smokes the inference image on its fallback path (no model
          # cache on the runner); the models themselves are exercised by the
          # slow lane above.
          printf 'MCPR_ADMIN_TOKEN=%s\nMCPR_AGENT_KEYS=smoke:%s\nMCPR_HOST_PORT=8450\nPOSTGRES_PASSWORD=%s\nMCPR_IMAGE=mcp-router:local-inference\nMCPR_DECISION_BACKEND=deterministic\nMCPR_EMBEDDING_BACKEND=hash\n' \
            "$admin" "$agent" "$pgpw" >> .env
          echo "MCPR_ADMIN_TOKEN=$admin" >> "$GITHUB_ENV"
          echo "MCPR_AGENT_KEY=$agent" >> "$GITHUB_ENV"
      - name: Start the stack
        run: docker compose -p mcprsmoke up -d --no-build --wait --wait-timeout 300
      - name: Smoke
        run: scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose -p mcprsmoke logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose -p mcprsmoke down -v
