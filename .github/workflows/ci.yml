name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Least privilege: read-only for every job. No job needs a write scope.
permissions:
  contents: read

# Explicit bash = `bash -eo pipefail`: a failing command piped into tee fails.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs only; never a push run mid-flight.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Path filters apply to pull requests only: a push to master always runs
# everything, because release.yml's verify job trusts a green push run.
# No retries anywhere (pytest, vitest, steps): a flake is a bug to fix.
jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # paths-filter lists PR files via the API
    outputs:
      backend: ${{ github.event_name == 'push' || steps.filter.outputs.backend == 'true' }}
      ui: ${{ github.event_name == 'push' || steps.filter.outputs.ui == 'true' }}
      smoke: ${{ github.event_name == 'push' || steps.filter.outputs.smoke == 'true' }}
      docs: ${{ github.event_name == 'push' || steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'testbed/**'
              - 'bench/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'mypy-baseline.txt'
              - 'CHANGELOG.md'
              - 'ui/package.json'
              - '.github/**'
            ui:
              - 'ui/**'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
            smoke:
              - 'src/**'
              - 'ui/**'
              - 'Dockerfile*'
              - '.dockerignore'
              - 'docker-compose*.yml'
              - '.env.example'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            docs:
              - '**/*.md'
              - 'docs/**'

  lint-type:
    name: lint-type (ruff, mypy, lock)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Install (locked, zero-ML)
        run: |
          uv sync --locked --extra dev --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: ruff check .
      - run: ruff format --check .
      - name: mypy (src+bench strict; tests+testbed <= mypy-baseline.txt)
        run: python .github/scripts/mypy_baseline.py

  unit:
    name: unit (pytest -n auto)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mcprouter
          POSTGRES_PASSWORD: mcprouter
          POSTGRES_DB: mcprouter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcprouter"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Names the server only: tests use <db>_test_template / <db>_test_w<N>.
      MCPR_DATABASE_URL: postgresql+psycopg://mcprouter:mcprouter@localhost:5432/mcprouter
      MCPR_REQUIRE_DB: "1"  # a DB-down run fails instead of silently skipping
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install (locked, zero-ML)
        run: |
          uv sync --locked --extra dev --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: pytest (not e2e/slow/scale)
        run: |
          mkdir -p reports
          pytest tests/ -q -n auto -m "not e2e and not slow and not scale" \
            --junitxml=reports/unit.xml 2>&1 | tee reports/unit.log
      - name: Upload pytest output on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-unit
          path: reports/
          retention-days: 7

  e2e:
    name: e2e (pytest --dist loadfile)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mcprouter
          POSTGRES_PASSWORD: mcprouter
          POSTGRES_DB: mcprouter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcprouter"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Names the server only: tests use <db>_test_template / <db>_test_w<N>.
      MCPR_DATABASE_URL: postgresql+psycopg://mcprouter:mcprouter@localhost:5432/mcprouter
      MCPR_REQUIRE_DB: "1"  # a DB-down run fails instead of silently skipping
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install (locked, zero-ML)
        run: |
          uv sync --locked --extra dev --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # loadfile: every e2e module runs on one worker (several bind module-level ports).
      - name: pytest (e2e)
        run: |
          mkdir -p reports
          pytest tests/ -q -n auto --dist loadfile -m "e2e and not slow and not scale" \
            --junitxml=reports/e2e.xml 2>&1 | tee reports/e2e.log
      - name: Upload pytest output on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-e2e
          path: reports/
          retention-days: 7

  # Docs-only changes still run the doc/version meta-tests (no DB needed).
  docs:
    name: docs (meta-tests)
    needs: changes
    if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.backend != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install (locked, zero-ML)
        run: |
          uv sync --locked --extra dev --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: pytest (docs + version lockstep)
        run: pytest tests/ -q -m "not db and not e2e and not slow and not scale" -k "docs or version_lockstep"

  ui:
    name: ui (build, lint, test)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc  # same major as the image's node:22-slim
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - name: vitest
        run: |
          mkdir -p reports
          npm test -- --reporter=default --reporter=github-actions 2>&1 | tee reports/vitest.log
      - name: Upload vitest output on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest
          path: ui/reports/
          retention-days: 7

  # Builds the real image (buildx, GitHub Actions layer cache) and runs the
  # compose stack end to end (scripts/smoke.sh).
  compose-smoke:
    name: compose-smoke
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: mcp-router:local
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Write .env (ephemeral per-run credentials)
        run: |
          admin=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          agent=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          pgpw=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')
          echo "::add-mask::$admin"; echo "::add-mask::$agent"; echo "::add-mask::$pgpw"
          cp .env.example .env
          printf 'MCPR_ADMIN_TOKEN=%s\nMCPR_AGENT_KEYS=smoke:%s\nMCPR_HOST_PORT=8450\nPOSTGRES_PASSWORD=%s\n' \
            "$admin" "$agent" "$pgpw" >> .env
          echo "MCPR_ADMIN_TOKEN=$admin" >> "$GITHUB_ENV"
          echo "MCPR_AGENT_KEY=$agent" >> "$GITHUB_ENV"
      - name: Start the stack
        run: docker compose -p mcprsmoke up -d --no-build --wait --wait-timeout 180
      - name: Smoke
        run: scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose -p mcprsmoke logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose -p mcprsmoke down -v

  # The ONE required status check. A job only blocks a merge if it is named
  # here AND its result is checked below (`needs` alone passes on skipped).
  # A skipped job passes only when the path filter said it was irrelevant.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, lint-type, unit, e2e, docs, ui, compose-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every relevant job to succeed
        env:
          CHANGES: ${{ needs.changes.result }}
          BACKEND: ${{ needs.changes.outputs.backend }}
          UI_REL: ${{ needs.changes.outputs.ui }}
          SMOKE_REL: ${{ needs.changes.outputs.smoke }}
          DOCS_REL: ${{ needs.changes.outputs.docs == 'true' && needs.changes.outputs.backend != 'true' }}
          LINT_TYPE: ${{ needs.lint-type.result }}
          UNIT: ${{ needs.unit.result }}
          E2E: ${{ needs.e2e.result }}
          DOCS: ${{ needs.docs.result }}
          UI: ${{ needs.ui.result }}
          COMPOSE_SMOKE: ${{ needs.compose-smoke.result }}
        run: |
          fail=0
          check() {  # name result relevant
            if [ "$2" = success ]; then echo "ok   $1"; return; fi
            if [ "$2" = skipped ] && [ "$3" != true ]; then echo "skip $1 (no relevant changes)"; return; fi
            echo "::error::$1 is '$2' (relevant=$3)"; fail=1
          }
          check changes "$CHANGES" true
          check lint-type "$LINT_TYPE" "$BACKEND"
          check unit "$UNIT" "$BACKEND"
          check e2e "$E2E" "$BACKEND"
          check docs "$DOCS" "$DOCS_REL"
          check ui "$UI" "$UI_REL"
          check compose-smoke "$COMPOSE_SMOKE" "$SMOKE_REL"
          exit "$fail"
