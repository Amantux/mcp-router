name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Least privilege: read-only for every job. No job needs a write scope.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs only; never a push run mid-flight.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mcprouter
          POSTGRES_PASSWORD: mcprouter
          POSTGRES_DB: mcprouter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcprouter"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MCPR_DATABASE_URL: postgresql+psycopg://mcprouter:mcprouter@localhost:5432/mcprouter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      # Zero-ML path only: the [inference] extra (torch/transformers/laya) is
      # deliberately NOT installed; everything must pass on hash + deterministic.
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy
      - name: pytest
        run: pytest tests/ -q

  ui:
    name: ui (build, lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  # The ONE required status check. A job only blocks a merge if it is named
  # here AND its result is checked below (`needs` alone passes on skipped).
  ci-gate:
    name: ci-gate
    if: always()
    needs: [backend, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every needed job to succeed
        env:
          BACKEND: ${{ needs.backend.result }}
          UI: ${{ needs.ui.result }}
        run: |
          echo "backend=$BACKEND ui=$UI"
          test "$BACKEND" = "success"
          test "$UI" = "success"
