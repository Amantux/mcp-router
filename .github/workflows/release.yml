name: release
# On a vX.Y.Z[suffix] tag: `verify` proves the tag is shippable (D7), then both
# images build and push. Nothing publishes unless verify succeeds:
#   - tag == "v" + pyproject version, top CHANGELOG heading == that version
#   - a successful `CI` push run exists for this exact SHA on master
#   - the SHA is an ancestor of origin/master (no releasing side branches)
# `:latest` / `:latest-inference` move only for a plain vX.Y.Z tag.
# Tag protection (who may push v* tags) is a repo ruleset, not this file.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

# Nothing at workflow level; each job declares exactly what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/amantux/mcp-router

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read  # read CI runs for this SHA
    outputs:
      is_release: ${{ steps.local.outputs.is_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag matches pyproject version and CHANGELOG
        id: local
        env:
          TAG: ${{ github.ref_name }}
        run: |
          out=$(python3 .github/scripts/release_verify.py "$TAG") || { echo "$out"; exit 1; }
          echo "$out" | tee -a "$GITHUB_OUTPUT"
      - name: SHA is an ancestor of origin/master
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master \
            || { echo "::error::$GITHUB_SHA is not on origin/master"; exit 1; }
      - name: A green CI push run exists for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&branch=master&status=success" --jq .total_count)
          echo "successful CI push runs for $GITHUB_SHA on master: $n"
          test "$n" -ge 1 || { echo "::error::no green CI run on master for $GITHUB_SHA"; exit 1; }

  image:
    name: image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ needs.verify.outputs.is_release == 'true' && format('{0}:latest', env.IMAGE) || '' }}

  # Fails visibly (no continue-on-error): a release whose inference flavour did
  # not ship is not a complete release.
  image-inference:
    name: image-inference
    needs: [verify, image]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.inference
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}-inference
            ${{ needs.verify.outputs.is_release == 'true' && format('{0}:latest-inference', env.IMAGE) || '' }}
