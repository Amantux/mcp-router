[project]
name = "mcprouter"
version = "0.5.0"
description = "MCP Intelligent Routing Platform — local-first MCP discovery, cataloging, and intelligent tool routing"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.4",
  "uvicorn[standard]==0.52.3",
  "sqlalchemy==2.0.52",
  "psycopg[binary]==3.3.6",
  "pgvector==0.5.0",
  "alembic==1.17.1",
  "pydantic==2.13.5",
  "mcp==2.3.0",
  "httpx==0.28.1",
  "prometheus-client==0.24.1",
  "structlog==25.5.0",
  "jsonschema==4.26.0",
  # SKILL.md frontmatter (wave-4 skills); only yaml.safe_load is used.
  "pyyaml==6.0.3",
  # Imported directly by mcpclient for transport-error mapping (transitive via
  # mcp); declared so a resolver change cannot silently drop it.
  "httpx2==2.13.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-xdist==3.8.0",
  "pytest-timeout==2.4.0",
  "ruff==0.15.22",
  "mypy==2.3.0",
  "types-requests",
  "types-jsonschema==4.26.0.20260408",
  "types-PyYAML==6.0.12.20260906",
]
# Inference extra: heavy, optional — the app must run (deterministic fallback)
# without it. CPU-only torch on this dev box; CUDA wheels on the target laptop.
inference = [
  "torch>=2.4",
  "transformers>=4.48",
  "sentence-transformers>=3.3",
  "laya==0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcprouter"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "testbed"]

[tool.ruff.lint]
# Pinned select (house rule): no version-default drift.
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "BLE"]
ignore = ["B008"]  # FastAPI Depends() in defaults — framework idiom

[tool.mypy]
python_version = "3.12"
strict = true
# src + bench must be clean (strict). tests + testbed run under the relaxed
# override below and are held to mypy-baseline.txt by
# .github/scripts/mypy_baseline.py (fails on any error not in the baseline).
files = ["src/mcprouter", "bench", "tests", "testbed"]
mypy_path = "src"

# The [inference] extra is OPTIONAL and CI runs without it. These modules are
# imported lazily inside the inference backends; when absent they type as Any.
# When installed (torch/numpy/sentence-transformers/huggingface_hub ship
# py.typed) this override has no effect. laya ships no py.typed either way.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "numpy", "numpy.*", "sentence_transformers", "sentence_transformers.*", "huggingface_hub", "huggingface_hub.*", "laya", "laya.*"]
ignore_missing_imports = true

# Relaxed for test code: untyped test functions/fixtures are idiomatic pytest.
[[tool.mypy.overrides]]
module = ["tests.*", "testbed.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Suite policy (D17): unknown markers are errors; every test has a timeout;
# skips are always reported (-ra). No retries anywhere: flakes are fixed.
addopts = "--strict-markers -ra --durations=25"
timeout = 120
markers = [
  "db: needs the test database (auto-added from the db fixture; MCPR_REQUIRE_DB=1 fails instead of skipping)",
  "e2e: real servers/transports (by module name in tests/conftest.py; 300 s timeout)",
  "slow: loads/downloads real models; set MCPR_RUN_SLOW=1",
  "scale: fleet/catalog scale runs (nightly)",
]
