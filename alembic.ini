# Developer entry point for the Alembic CLI, e.g.
#   .venv/bin/alembic -c alembic.ini revision -m "add foo"
#   .venv/bin/alembic -c alembic.ini history
# The database URL comes from MCPR_DATABASE_URL (migrations/env.py), never
# from this file. Operators use `python -m mcprouter.migrate` instead, which
# also takes the migration lock and runs the pre-0.6 bridge.
[alembic]
script_location = %(here)s/src/mcprouter/migrations
file_template = v%%(rev)s_%%(slug)s
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
