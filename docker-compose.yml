services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mcprouter
      POSTGRES_PASSWORD: mcprouter
      POSTGRES_DB: mcprouter
    ports:
      - "5434:5432"
    volumes:
      - mcpr-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcprouter"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      MCPR_DATABASE_URL: postgresql+psycopg://mcprouter:mcprouter@db:5432/mcprouter
      MCPR_AGENT_KEYS: ${MCPR_AGENT_KEYS:-}
      MCPR_EMBEDDING_BACKEND: ${MCPR_EMBEDDING_BACKEND:-hash}
      MCPR_DECISION_BACKEND: ${MCPR_DECISION_BACKEND:-deterministic}
      MCPR_DEVICE: ${MCPR_DEVICE:-auto}
    ports:
      - "8400:8400"
    depends_on:
      db:
        condition: service_healthy
    # GPU passthrough on the target laptop (WSL2/Docker with the NVIDIA
    # runtime). Commented so CPU-only hosts run unchanged:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  mcpr-pgdata:
